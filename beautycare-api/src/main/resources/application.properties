# --- Spring Boot Server Configuration ---
server.port=8080

# --- Database Connection (PostgreSQL) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/beautycare_db
spring.datasource.username=admin
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate Configuration ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Flyway Migration ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- JWT Configuration ---
# Clave secreta (HS512) para firmar los tokens. Debe ser larga y segura.
# (Esta es una clave de ejemplo generada aleatoriamente)
app.jwt.secret=N2Y4YjY5MmE2ZDRkNmU2YjVmN2E3NTZiNzE0ZjdjNDEzOTgwZDIyYjZmY2Q0OWU4OTI5MjRhMzA2YmE5N2U5ZQ==
# Tiempo de expiración en milisegundos (1 hora = 3600000 ms)
app.jwt.expiration-ms=3600000