# --- Spring Boot Server Configuration ---
# Define el puerto del servidor. Coincide con el docker-compose.yml
server.port=8080

# --- Database Connection (PostgreSQL) ---
# URL de conexión para desarrollo local (fuera de Docker)
# Apunta a la BD expuesta en el puerto 5432
spring.datasource.url=jdbc:postgresql://localhost:5432/beautycare_db
spring.datasource.username=admin
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate Configuration ---
# Le decimos a Hibernate que valide el esquema contra la BD.
# 'validate' asegura que Flyway es el único que realiza cambios.
spring.jpa.hibernate.ddl-auto=validate
# Muestra el SQL generado por Hibernate en la consola (útil para debug)
spring.jpa.show-sql=true
# Formatea el SQL mostrado en la consola para mejor legibilidad
spring.jpa.properties.hibernate.format_sql=true

# --- Flyway Migration ---
# Habilita Flyway. Spring Boot lo detectará y ejecutará las migraciones
# automáticamente al arrancar.
spring.flyway.enabled=true
# Ubicación de los scripts de migración. 'db/migration' es el estándar oficial.
spring.flyway.locations=classpath:db/migration