name: 'beautycare-dev' # Define el nombre del proyecto para aislar todos los recursos

services:
  # Servicio 1: Base de Datos Core
  beautycare_db:
    image: postgres:16-alpine
    container_name: beautycare-dev-db
    environment:
      POSTGRES_DB: beautycare_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432" # Puerto estándar de PostgreSQL
    volumes:
      - beautycare-db-data:/var/lib/postgresql/data
    networks:
      - beautycare-net

  # Servicio 2: Base de Datos Inventario
  inventory_db:
    image: postgres:16-alpine
    container_name: beautycare-dev-inventory-db
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5433:5432" # Puerto expuesto 5433 para evitar colisión
    volumes:
      - inventory-db-data:/var/lib/postgresql/data
    networks:
      - beautycare-net

  # Servicio 3: API Core (Monolito)
  beautycare_api:
    build:
      context: ./beautycare-api
      dockerfile: Dockerfile
    container_name: beautycare-dev-api
    depends_on:
      - beautycare_db
    ports:
      - "8080:8080"
    environment:
      # Propiedades de la Base de Datos
      SPRING_DATASOURCE_URL: jdbc:postgresql://beautycare_db:5432/beautycare_db
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      # --- NUEVAS PROPIEDADES JWT ---
      # Spring Boot convierte 'app.jwt.secret' a 'APP_JWT_SECRET'
      APP_JWT_SECRET: N2Y4YjY5MmE2ZDRkNmU2YjVmN2E3NTZiNzE0ZjdjNDEzOTgwZDIyYjZmY2Q0OWU4OTI5MjRhMzA2YmE5N2U5ZQ==
      APP_JWT_EXPIRATION_MS: 3600000
    networks:
      - beautycare-net

  # Servicio 4: API Inventario (Microservicio)
  inventory_service:
    build:
      context: ./inventory-service
      dockerfile: Dockerfile
    container_name: beautycare-dev-inventory-service
    depends_on:
      - inventory_db
    ports:
      - "8081:8081"
    environment:
      # Propiedades de la Base de Datos
      SPRING_DATASOURCE_URL: jdbc:postgresql://inventory_db:5432/inventory_db
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SERVER_PORT: 8081
      # --- NUEVAS PROPIEDADES JWT ---
      # Deben ser idénticas al servicio core
      APP_JWT_SECRET: N2Y4YjY5MmE2ZDRkNmU2YjVmN2E3NTZiNzE0ZjdjNDEzOTgwZDIyYjZmY2Q0OWU4OTI5MjRhMzA2YmE5N2U5ZQ==
      APP_JWT_EXPIRATION_MS: 3600000
    networks:
      - beautycare-net

# Volúmenes para persistir datos de las BDs
volumes:
  beautycare-db-data:
  inventory-db-data:

# Red para la comunicación interna entre contenedores
networks:
  beautycare-net:
    driver: bridge