# --- Spring Boot Server Configuration ---
server.port=8081

# --- Database Connection (PostgreSQL) ---
spring.datasource.url=jdbc:postgresql://localhost:5433/inventory_db
spring.datasource.username=admin
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate Configuration ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Flyway Migration ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- JWT Configuration ---
# DEBE ser la misma clave secreta que el servicio de autenticación
app.jwt.secret=N2Y4YjY5MmE2ZDRkNmU2YjVmN2E3NTZiNzE0ZjdjNDEzOTgwZDIyYjZmY2Q0OWU4OTI5MjRhMzA2YmE5N2U5ZQ==
# La expiración también es necesaria para validar
app.jwt.expiration-ms=3600000